<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  background: radial-gradient(circle at top left, #0a0a0f, #050508 60%, #020204);
  color: #e8e8f0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
}
.gold-text {
  background: linear-gradient(135deg, #ffd700 0%, #ffb300 25%, #fff8b0 50%, #ffb300 75%, #b8860b 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: bold;
}
.pink-rayan {
  color: #ff79c6;
  font-weight: bold;
  text-shadow: 0 0 8px rgba(255, 121, 198, 0.6);
}

/* ===== VOILES ANIMÉS ===== */
.zone-veil {
  position: fixed;
  top: 0;
  width: 55vw;
  height: 100vh;
  pointer-events: none;
  z-index: 5;
  opacity: 0;
  transition: opacity 0.6s ease, transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
}
.zone-veil.red {
  left: 0;
  background: radial-gradient(ellipse at top left, rgba(255, 40, 40, 0.45) 0%, rgba(180, 0, 0, 0.18) 35%, transparent 70%);
  transform: translateX(-100%) skewX(-8deg);
}
.zone-veil.purple {
  right: 0;
  background: radial-gradient(ellipse at top right, rgba(189, 147, 249, 0.45) 0%, rgba(98, 114, 164, 0.18) 35%, transparent 70%);
  transform: translateX(100%) skewX(8deg);
}
.zone-veil.active {
  opacity: 1;
  transform: translateX(0) skewX(0);
}

.sweep-overlay {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 999;
  opacity: 0;
  transition: opacity 0.25s ease;
}
.sweep-overlay.fire {
  animation: sweepFire 0.75s cubic-bezier(0.7, 0, 0.3, 1) forwards;
}
.sweep-overlay.fire.from-left {
  background: linear-gradient(90deg, rgba(255, 50, 50, 0.85) 0%, rgba(255, 50, 50, 0.35) 45%, transparent 100%);
}
.sweep-overlay.fire.from-right {
  background: linear-gradient(270deg, rgba(189, 147, 249, 0.85) 0%, rgba(189, 147, 249, 0.35) 45%, transparent 100%);
}
@keyframes sweepFire {
  0%   { opacity: 0; transform: translateX(0); }
  15%  { opacity: 1; }
  100% { opacity: 0; transform: translateX(0); }
}

.app-header {
  height: 52px;
  background: rgba(15, 15, 25, 0.85);
  border-bottom: 1px solid rgba(255, 215, 0, 0.3);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  z-index: 100;
  flex-shrink: 0;
  position: relative;
}
.logo-area { display: flex; align-items: center; gap: 10px; }
.logo {
  width: 36px; height: 36px;
  background: radial-gradient(circle, #ffd700, #b8860b);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-weight: bold; font-size: 11px; color: #1a1a1a;
}
.app-title h1 { font-size: 14px; }
.app-title .version { font-size: 10px; color: #888; }
.header-actions { display: flex; gap: 6px; align-items: center; }
.icon-btn {
  width: 32px; height: 32px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 215, 0, 0.2);
  border-radius: 8px;
  color: #e8e8f0;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}
.icon-btn:active { background: rgba(255, 215, 0, 0.15); }

/* ===== Icône Discord dorée dans le header ===== */
.discord-icon-btn {

  border-radius: 8px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 10px rgba(255, 215, 0, 0.25);
  transition: background 0.2s, box-shadow 0.2s, transform 0.15s;
  padding: 0;
}
.discord-icon-btn svg { width: 20px; height: 20px; display: block; }
.discord-icon-btn svg path { fill: #ffd700; }
.discord-icon-btn:hover { background: rgba(255, 215, 0, 0.18); box-shadow: 0 0 16px rgba(255, 215, 0, 0.5); }
.discord-icon-btn:active { transform: scale(0.92); }

.app-main {

  padding: 8px;

  min-height: 0;

}
.sidebar {

  flex-direction: column;
  align-items: center;

  overflow-y: auto;

}
.nav-btn {

  font-size: 16px;
  cursor: pointer;

.nav-btn:active { transform: scale(0.92); }
.nav-btn.active {

.nav-btn[data-cat="zone-red"].active {

  border-color: #ff9999;

}
.nav-btn[data-cat="zone-purple"].active {

}
.nav-btn[data-cat="cheat"].active {

.panel-header {

.panel-header.zone-purple-theme { border-color: rgba(189, 147, 249, 0.5); box-shadow: 0 0 20px rgba(189, 147, 249, 0.15); }
.panel-header.cheat-theme { border-color: rgba(255, 121, 198, 0.5); box-shadow: 0 0 20px rgba(255, 121, 198, 0.15); }

.panel-header h2 { font-size: 15px; margin-bottom: 2px; }
.panel-header p { font-size: 11px; color: #999; }
.search-input {

}
.panel-content {

  overflow-y: auto;

  padding: 4px;
  border-radius: 12px;
  min-height: 0;

}
.panel-content::-webkit-scrollbar { width: 6px; }
.panel-content::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #ffd700, #b8860b); border-radius: 3px; }
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 10px;

.card {
  background: rgba(25, 25, 40, 0.8);
  border: 1px solid rgba(255, 215, 0, 0.15);
  border-radius: 10px;

  cursor: pointer;
  transition: transform 0.2s, background 0.2s, border-color 0.3s, box-shadow 0.3s;
  min-height: 90px;
  display: block;
  user-select: none;
  backdrop-filter: blur(4px);
}
.card:active {

  border-color: rgba(255, 215, 0, 0.4);

.card.card-red { border-color: rgba(255, 60, 60, 0.35); }

.card-title {

.card-desc {

}
.right-panel {

.right-header {

.detail-content {

.detail-title { font-size: 16px; margin-bottom: 4px; }

.detail-meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 11px; }

.tutorial-content {

  border-radius: 8px;

  border: 1px solid rgba(255, 215, 0, 0.15);

.tutorial-content .cmd { color: #50dc78; font-weight: bold; }

.wiki-box .wiki-title { font-size: 12px; font-weight: bold; margin-bottom: 6px; color: #ffd700; }
.wiki-box .wiki-loading { color: #888; font-style: italic; }
.wiki-box a { color: #ffd700; text-decoration: underline; word-break: break-all; }

/* ===== BOUTONS DE LIENS EXTERNES ===== */
.link-btn {
  width: 100%;
  height: 34px;
  font-size: 12px;
  border-radius: 7px;

.link-btn.mega { border-color: rgba(255, 60, 60, 0.4); color: #ff8888; background: rgba(255, 60, 60, 0.1); }

@media (max-width: 900px) {

  .cards-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }

@media (max-width: 500px) {

</style>
</head>

        tools: ["Lua", "DLL Injection", "Fortnite", "Anti-Cheat"],
        tutorial: `# ===== SCRIPTS LUA, INJECTION DLL & CHEATS =====

## 1. COMMENT FONCTIONNE UN SCRIPT LUA

Un script Lua est un fichier texte (.lua) exécuté par un interpréteur Lua
intégré au jeu. Il ne touche PAS directement à la mémoire du jeu : il utilise
une API exposée par le moteur.

Exemple basique :
  -- Script Lua simple
  local player = game.Players.LocalPlayer
  local character = player.Character
  local humanoid = character:FindFirstChild("Humanoid")
  humanoid.Health = 0  -- tue le joueur

Le jeu expose des fonctions (API) que le script peut appeler. Le script
n'a accès qu'à ce que l'API autorise. C'est un environnement sandboxé.

## 2. INJECTION DLL (C++ / Windows)

L'injection DLL consiste à forcer un processus cible (le jeu) à charger une
DLL qu'on a écrite. La DLL s'exécute DANS le processus du jeu et a donc
accès à toute sa mémoire.

Étapes typiques :
  1. Ouvrir le processus du jeu (OpenProcess).
  2. Allouer de la mémoire (VirtualAllocEx).
  3. Écrire le chemin de la DLL (WriteProcessMemory).
  4. Créer un thread distant (CreateRemoteThread) sur LoadLibraryA.
  5. La DLL est chargée et son DllMain s'exécute.

Techniques : CreateRemoteThread, SetWindowsHookEx, Manual Mapping,
Process Hollowing, Reflective DLL Injection.

## 3. CHEATS FORTNITE 2017-2022

En 2017-2022, Fortnite (Unreal Engine 4) était massivement ciblé :
  - Aimbot : visée automatique sur la tête.
  - Wallhack : voir à travers les murs (ESP).
  - Fly / Speed : voler ou courir plus vite.
  - No Recoil : supprimer le recul des armes.
  - Instant Build : construire instantanément.

Ces cheats étaient possibles car :
  - L'anti-cheat BattlEye / EAC était contournable.
  - Le client faisait confiance à certaines données locales.
  - Les DLL injectées pouvaient hooker les fonctions du moteur.

## 4. POURQUOI CE N'EST PLUS POSSIBLE AUJOURD'HUI

Epic Games a énormément renforcé la sécurité :
  - Anti-cheat kernel-level (BattlEye + EAC) qui détecte les DLL injectées.
  - Chiffrement mémoire et obfuscation du moteur.
  - Validation serveur-authoritative : le serveur ne fait plus confiance au client.
  - Bans HWID (hardware ID) et ban waves massives.
  - Poursuites judiciaires contre les vendeurs de cheats.

Résultat : la majorité des cheats publics sont détectés en quelques heures.

## 5. POURQUOI ON NE PEUT PAS SE DONNER DES V-BUCKS

Les V-Bucks sont stockés sur les serveurs d'Epic Games, PAS sur ton appareil.
Quand tu achètes des V-Bucks, c'est une transaction serveur → serveur avec
le payment provider. Modifier ton client local ne change RIEN au solde réel.

Tenter de :
  - Modifier la mémoire locale → le serveur ignore, ton solde reste 0.
  - Intercepter la requête d'achat → signature cryptographique invalide.
  - Rejouer une requête → nonce + timestamp + signature TLS.

Toute tentative est loggée côté serveur et entraîne un ban définitif.

## 6. POURQUOI ON NE PEUT PAS MANIPULER LES SERVEURS

Les serveurs de jeux en ligne sont hébergés chez Epic / AWS / Azure, avec :
  - Authentification par token JWT signé.
  - Chiffrement TLS 1.3 + certificate pinning.
  - Rate limiting et détection d'anomalies.
  - Logs immuables et monitoring 24/7.

Un particulier ne peut pas "hacker" les serveurs de Fortnite sans :
  - Une faille 0-day critique (rarissime et très précieuse).
  - Des ressources étatiques (APT).
  - Une autorisation légale (bug bounty, pentest).

## 7. CE QUI EST LÉGAL ET ÉTHIQUE

  - Analyser des jeux OFFLINE (émulateurs, ROMs personnelles).
  - Reverse engineer SES PROPRES logiciels.
  - Participer à des bug bounties (Epic en a un).
  - Apprendre Lua / C++ / reverse engineering sur des jeux sandbox.
  - Développer des mods pour des jeux solo (Skyrim, Minecraft solo).

## 8. RÉSUMÉ

  Lua         → sandboxé, n'a accès qu'à l'API exposée par le jeu.
  DLL Inject  → accès total au processus, mais détecté par anti-cheat.
  V-Bucks     → stockés côté serveur, impossible à modifier localement.
  Serveurs    → protégés par TLS, signatures, monitoring.
  Cheats      → possibles techniquement, illégaux et bannis.

# ===== FIN TUTORIEL LUA & CHEATS =====`

// ============================================================
// WIKIPÉDIA API
// ============================================================
const wikiCache = {};

async function fetchWikipedia(page, lang = "fr") {
  const key = lang + ":" + page;
  if (wikiCache[key]) return wikiCache[key];
  try {
    const url = `https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(page)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const result = {
      title: data.title || page,
      extract: data.extract || "Aucun résumé disponible.",
      url: data.content_urls?.desktop?.page || `https://${lang}.wikipedia.org/wiki/${page}`
    };
    wikiCache[key] = result;
    return result;
  } catch (e) {
    return { title: page, extract: "⚠️ Wikipédia inaccessible (vérifie ta connexion).", url: `https://fr.wikipedia.org/wiki/${page}`, error: true };
  }
}

const AppState = { currentCat: "home", searchQuery: "" };

// ============================================================
// VOILES ET TRANSITIONS
// ============================================================
const veilRed = document.getElementById("veilRed");
const veilPurple = document.getElementById("veilPurple");
const sweepOverlay = document.getElementById("sweepOverlay");

function updateZoneVeils(catName) {
  const cat = CATEGORIES[catName];
  const theme = cat?.theme || null;
  if (theme === "red") {
    veilRed.classList.add("active");
    veilPurple.classList.remove("active");
  } else if (theme === "purple") {
    veilPurple.classList.add("active");
    veilRed.classList.remove("active");
  } else {
    veilRed.classList.remove("active");
    veilPurple.classList.remove("active");
  }
}

function triggerSweep(theme) {
  if (!theme) return;
  sweepOverlay.classList.remove("fire", "from-left", "from-right");
  void sweepOverlay.offsetWidth;
  sweepOverlay.classList.add("fire", theme === "red" ? "from-left" : "from-right");
  setTimeout(() => {
    sweepOverlay.classList.remove("fire", "from-left", "from-right");
  }, 800);
}

function updatePanelsTheme(theme) {
  const panelHeader = document.getElementById("panelHeader");
  const rightPanel = document.getElementById("rightPanel");
  panelHeader.classList.remove("zone-red-theme", "zone-purple-theme", "cheat-theme");
  rightPanel.classList.remove("zone-red-theme", "zone-purple-theme", "cheat-theme");
  if (theme) {
    panelHeader.classList.add(theme === "cheat" ? "cheat-theme" : theme + "-theme");
    rightPanel.classList.add(theme === "cheat" ? "cheat-theme" : theme + "-theme");
  }
}

// ============================================================
// NAVIGATION
// ============================================================
function showCategory(catName) {
  const cat = CATEGORIES[catName];
  if (!cat) return;
  const previousCat = AppState.currentCat;
  const previousTheme = CATEGORIES[previousCat]?.theme || null;
  const newTheme = cat.theme || null;

  if (newTheme && newTheme !== previousTheme) {
    triggerSweep(newTheme);
  } else if (!newTheme && previousTheme && previousTheme !== "cheat") {
    triggerSweep(previousTheme);
  }

  AppState.currentCat = catName;
  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.cat === catName);
  });

  updateZoneVeils(catName);
  updatePanelsTheme(newTheme);

  // Titre : innerHTML pour pouvoir afficher "Rayan" en rose
  document.getElementById("catTitle").innerHTML = cat.title;
  document.getElementById("catDesc").textContent = cat.desc;
  renderContent();
}

// ============================================================
// RENDU DES CARTES
// ============================================================
function renderContent() {
  const cat = CATEGORIES[AppState.currentCat];
  let items = cat.items;
  if (AppState.searchQuery) {
    items = items.filter(it =>
      it.name.toLowerCase().includes(AppState.searchQuery) ||
      it.desc.toLowerCase().includes(AppState.searchQuery)
    );
  }
  const container = document.getElementById("content");
  container.innerHTML = "";

  if (items.length === 0) {
    container.innerHTML = `<p style="font-size:12px;color:#888;text-align:center;padding:20px;">Aucun élément.</p>`;
    return;
  }

  const grid = document.createElement("div");
  grid.className = "cards-grid";
  const theme = cat.theme || null;

  items.forEach(it => {
    const card = document.createElement("div");
    card.className = "card" + (theme === "red" ? " card-red" : theme === "purple" ? " card-purple" : theme === "cheat" ? " card-cheat" : "");
    card.innerHTML = `
      <div class="card-title">
        <span>${it.icon}</span>
        <span class="gold-text">${it.name}</span>
      </div>
      <div class="card-desc">${it.desc.substring(0, 130)}${it.desc.length > 130 ? "..." : ""}</div>
      <div class="detail-meta" style="margin-top:8px;">
        ${(it.tools || []).slice(0, 3).map(t => `<span class="meta-tag">${t}</span>`).join("")}
      </div>
    `;
    card.addEventListener("click", () => selectItem(it.id));
    grid.appendChild(card);
  });

  container.appendChild(grid);
  container.scrollTop = 0;
}

// ============================================================
// SÉLECTION D'UN ÉLÉMENT
// ============================================================
function selectItem(id) {
  for (const catName in CATEGORIES) {
    const item = CATEGORIES[catName].items.find(it => it.id === id);
    if (item) {
      renderDetail(item);
      document.getElementById("rightPanel").scrollTop = 0;
      if (window.innerWidth < 900) {
        document.getElementById("rightPanel").scrollIntoView({ behavior: "smooth" });
      }
      return;
    }
  }
}

async function renderDetail(item) {
  const container = document.getElementById("detailContent");

  const descClass = "detail-desc" + (item.id === "red-lua-cheats" ? " lua-card" : "");

  let html = `
    <div class="detail-title gold-text">${item.icon} ${item.name}</div>
    <div class="${descClass}">${item.desc}</div>
    <div class="detail-meta">
      ${(item.tools || []).map(t => `<span class="meta-tag">${t}</span>`).join("")}
    </div>
  `;

  // Liens externes (Mega / Telegram / Discord / share.zip)
  const externalLinks = [];
  if (item.megaLink) {
    externalLinks.push({ label: "Accéder au dossier Mega", url: item.megaLink, icon: "📥", style: "mega" });
  }
  if (Array.isArray(item.links)) {
    externalLinks.push(...item.links);
  }

  if (externalLinks.length > 0) {
    html += `
      <div style="margin-top:12px;">
        <div class="gold-text" style="font-size:12px;margin-bottom:6px;">🔗 Liens & Téléchargements</div>
        ${externalLinks.map(l => `
          <button class="link-btn ${l.style || ''}" onclick="window.open('${l.url}', '_blank')">
            <span>${l.icon || "🔗"}</span>
            <span>${l.label || l.url}</span>
            <span style="opacity:0.7;">↗</span>
          </button>
        `).join("")}
      </div>
    `;
  }

  if (item.tutorial) {
    html += `
      <div style="margin-top:12px;">
        <div class="gold-text" style="font-size:12px;margin-bottom:6px;">📋 Tutoriel complet</div>
        <div class="tutorial-content">${formatTutorial(item.tutorial)}</div>
      </div>
    `;
  }

  if (item.wiki) {
    html += `
      <div style="margin-top:12px;">
        <div class="gold-text" style="font-size:12px;margin-bottom:6px;">🌐 Fiche Wikipédia</div>
        <div class="wiki-box" id="wikiBox">
          <div class="wiki-title">${item.wiki}</div>
          <div class="wiki-loading">Chargement depuis Wikipédia...</div>
        </div>
      </div>
    `;
  }

  container.innerHTML = html;

  if (item.wiki) {
    try {
      const wiki = await fetchWikipedia(item.wiki, "fr");
      const box = document.getElementById("wikiBox");
      if (box) {
        if (wiki.error) {
          box.innerHTML = `
            <div class="wiki-title">${wiki.title}</div>
            <div class="wiki-loading">⚠️ Wikipédia inaccessible. <a href="${wiki.url}" target="_blank">Ouvrir sur Wikipédia</a></div>
          `;
        } else {
          box.innerHTML = `
            <div class="wiki-title">${wiki.title}</div>
            <div>${wiki.extract}</div>
            <div style="margin-top:8px;"><a href="${wiki.url}" target="_blank">📖 Lire l'article complet</a></div>
          `;
        }
      }
    } catch (e) {
      console.warn("Erreur wiki:", e);
    }
  }
}

// ============================================================
// FORMATAGE DES TUTORIELS
// ============================================================
function formatTutorial(text) {
  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/^(#.*)$/gm, '<span class="comment">$1</span>')
    .replace(/(pkg install|apt install|pip install|git clone|npm install|wget|curl|sudo|cd |mkdir |chmod |\.\/|apktool|apksigner|keytool)/g, '<span class="cmd">$1</span>')
    .replace(/(r2|ghidra|radare2|jadx|apktool|readelf|objdump|nm|strings|file|saveinstance)/gi, '<span class="keyword">$1</span>');
}
