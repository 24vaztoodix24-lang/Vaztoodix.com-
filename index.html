<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vaztoodix RE Studio — Édition & Mods</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  background: radial-gradient(circle at top left, #0a0a0f, #050508 60%, #020204);
  color: #e8e8f0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
}
.gold-text {
  background: linear-gradient(135deg, #ffd700 0%, #ffb300 25%, #fff8b0 50%, #ffb300 75%, #b8860b 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: bold;
}

/* ===== VOILES ANIMÉS ===== */
.zone-veil {
  position: fixed;
  top: 0;
  width: 55vw;
  height: 100vh;
  pointer-events: none;
  z-index: 5;
  opacity: 0;
  transition: opacity 0.6s ease, transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
}
.zone-veil.red {
  left: 0;
  background: radial-gradient(ellipse at top left, rgba(255, 40, 40, 0.45) 0%, rgba(180, 0, 0, 0.18) 35%, transparent 70%);
  transform: translateX(-100%) skewX(-8deg);
}
.zone-veil.purple {
  right: 0;
  background: radial-gradient(ellipse at top right, rgba(189, 147, 249, 0.45) 0%, rgba(98, 114, 164, 0.18) 35%, transparent 70%);
  transform: translateX(100%) skewX(8deg);
}
.zone-veil.active {
  opacity: 1;
  transform: translateX(0) skewX(0);
}

.sweep-overlay {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 999;
  opacity: 0;
  transition: opacity 0.25s ease;
}
.sweep-overlay.fire {
  animation: sweepFire 0.75s cubic-bezier(0.7, 0, 0.3, 1) forwards;
}
.sweep-overlay.fire.from-left {
  background: linear-gradient(90deg, rgba(255, 50, 50, 0.85) 0%, rgba(255, 50, 50, 0.35) 45%, transparent 100%);
}
.sweep-overlay.fire.from-right {
  background: linear-gradient(270deg, rgba(189, 147, 249, 0.85) 0%, rgba(189, 147, 249, 0.35) 45%, transparent 100%);
}
@keyframes sweepFire {
  0%   { opacity: 0; transform: translateX(0); }
  15%  { opacity: 1; }
  100% { opacity: 0; transform: translateX(0); }
}

.app-header {
  height: 52px;
  background: rgba(15, 15, 25, 0.85);
  border-bottom: 1px solid rgba(255, 215, 0, 0.3);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  z-index: 100;
  flex-shrink: 0;
  position: relative;
}
.logo-area { display: flex; align-items: center; gap: 10px; }
.logo {
  width: 36px; height: 36px;
  background: radial-gradient(circle, #ffd700, #b8860b);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-weight: bold; font-size: 11px; color: #1a1a1a;
}
.app-title h1 { font-size: 14px; }
.app-title .version { font-size: 10px; color: #888; }
.header-actions { display: flex; gap: 6px; }
.icon-btn {
  width: 32px; height: 32px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 215, 0, 0.2);
  border-radius: 8px;
  color: #e8e8f0;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}
.icon-btn:active { background: rgba(255, 215, 0, 0.15); }

.app-main {
  flex: 1;
  display: flex;
  gap: 8px;
  padding: 8px;
  overflow: hidden;
  min-height: 0;
  z-index: 10;
  position: relative;
}
.sidebar {
  width: 52px;
  background: rgba(15, 15, 25, 0.7);
  border: 1px solid rgba(255, 215, 0, 0.15);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px 0;
  gap: 6px;
  flex-shrink: 0;
  overflow-y: auto;
  backdrop-filter: blur(8px);
}
.nav-btn {
  width: 38px; height: 38px;
  background: rgba(40, 40, 60, 0.6);
  border: 1px solid rgba(255, 215, 0, 0.1);
  border-radius: 9px;
  font-size: 16px;
  cursor: pointer;
  color: #e8e8f0;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  transition: transform 0.2s, background 0.3s, border-color 0.3s;
}
.nav-btn:active { transform: scale(0.92); }
.nav-btn.active {
  background: linear-gradient(135deg, #ffd700, #b8860b);
  color: #1a1a1a;
  border-color: #fff8b0;
}
.nav-btn[data-cat="zone-red"].active {
  background: linear-gradient(135deg, #ff5555, #aa0000);
  color: #fff;
  border-color: #ff9999;
  box-shadow: 0 0 12px rgba(255, 60, 60, 0.6);
}
.nav-btn[data-cat="zone-purple"].active {
  background: linear-gradient(135deg, #bd93f9, #6272a4);
  color: #fff;
  border-color: #d7b3ff;
  box-shadow: 0 0 12px rgba(189, 147, 249, 0.6);
}
.nav-btn[data-cat="cheat"].active {
  background: linear-gradient(135deg, #ff79c6, #ff5555);
  color: #fff;
  border-color: #ffb86c;
  box-shadow: 0 0 12px rgba(255, 121, 198, 0.6);
}

.center-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
  min-height: 0;
}
.panel-header {
  background: rgba(15, 15, 25, 0.7);
  border: 1px solid rgba(255, 215, 0, 0.15);
  border-radius: 12px;
  padding: 10px 14px;
  flex-shrink: 0;
  backdrop-filter: blur(8px);
  transition: border-color 0.5s;
}
.panel-header.zone-red-theme { border-color: rgba(255, 60, 60, 0.5); box-shadow: 0 0 20px rgba(255, 60, 60, 0.15); }
.panel-header.zone-purple-theme { border-color: rgba(189, 147, 249, 0.5); box-shadow: 0 0 20px rgba(189, 147, 249, 0.15); }
.panel-header.cheat-theme { border-color: rgba(255, 121, 198, 0.5); box-shadow: 0 0 20px rgba(255, 121, 198, 0.15); }

.panel-header h2 { font-size: 15px; margin-bottom: 2px; }
.panel-header p { font-size: 11px; color: #999; }
.search-input {
  width: 100%; height: 26px;
  margin-top: 8px;
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 215, 0, 0.2);
  border-radius: 7px;
  padding: 0 10px;
  color: #e8e8f0;
  font-size: 12px;
  outline: none;
}
.panel-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 4px;
  border-radius: 12px;
  min-height: 0;
  -webkit-overflow-scrolling: touch;
}
.panel-content::-webkit-scrollbar { width: 6px; }
.panel-content::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #ffd700, #b8860b); border-radius: 3px; }
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 10px;
  padding-bottom: 20px;
}
.card {
  background: rgba(25, 25, 40, 0.8);
  border: 1px solid rgba(255, 215, 0, 0.15);
  border-radius: 10px;
  padding: 12px 14px;
  cursor: pointer;
  transition: transform 0.2s, background 0.2s, border-color 0.3s, box-shadow 0.3s;
  min-height: 90px;
  display: block;
  user-select: none;
  backdrop-filter: blur(4px);
}
.card:active {
  background: rgba(35, 35, 55, 0.9);
  border-color: rgba(255, 215, 0, 0.4);
  transform: scale(0.98);
}
.card.card-red { border-color: rgba(255, 60, 60, 0.35); }
.card.card-purple { border-color: rgba(189, 147, 249, 0.35); }
.card.card-cheat { border-color: rgba(255, 121, 198, 0.35); }

.card-title {
  font-size: 13px;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.card-desc {
  font-size: 11px;
  color: #a0a0b0;
  line-height: 1.5;
}
.right-panel {
  width: 42%;
  min-width: 320px;
  background: rgba(15, 15, 25, 0.75);
  border: 1px solid rgba(255, 215, 0, 0.2);
  border-radius: 12px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow-y: auto;
  min-height: 0;
  -webkit-overflow-scrolling: touch;
  backdrop-filter: blur(8px);
  transition: border-color 0.5s, box-shadow 0.5s;
}
.right-panel.zone-red-theme { border-color: rgba(255, 60, 60, 0.5); box-shadow: 0 0 20px rgba(255, 60, 60, 0.15); }
.right-panel.zone-purple-theme { border-color: rgba(189, 147, 249, 0.5); box-shadow: 0 0 20px rgba(189, 147, 249, 0.15); }
.right-panel.cheat-theme { border-color: rgba(255, 121, 198, 0.5); box-shadow: 0 0 20px rgba(255, 121, 198, 0.15); }

.right-panel.collapsed { width: 48px; min-width: 48px; padding: 6px 4px; }
.right-panel.collapsed .detail-content { display: none; }
.right-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  font-weight: bold;
  flex-shrink: 0;
}
.detail-content {
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 1;
  min-height: 0;
}
.detail-title { font-size: 16px; margin-bottom: 4px; }
.detail-desc {
  font-size: 12px;
  color: #b0b0c0;
  line-height: 1.6;
  padding: 10px;
  background: rgba(0, 0, 0, 0.3);
  border-radius: 8px;
  border-left: 3px solid #ffd700;
}
.detail-meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 11px; }
.meta-tag {
  background: rgba(255, 215, 0, 0.1);
  border: 1px solid rgba(255, 215, 0, 0.3);
  border-radius: 6px;
  padding: 4px 10px;
  color: #ffd700;
}
.tutorial-content {
  font-family: 'Consolas', 'Monaco', monospace;
  font-size: 11px;
  line-height: 1.7;
  background: rgba(0, 0, 0, 0.5);
  border-radius: 8px;
  padding: 12px;
  border: 1px solid rgba(255, 215, 0, 0.15);
  white-space: pre-wrap;
  color: #c0c0d0;
  overflow-x: auto;
}
.tutorial-content .cmd { color: #50dc78; font-weight: bold; }
.tutorial-content .comment { color: #6a6a80; font-style: italic; }
.tutorial-content .keyword { color: #ffd700; font-weight: bold; }
.wiki-box {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 215, 0, 0.2);
  border-radius: 8px;
  padding: 10px;
  font-size: 11px;
  line-height: 1.6;
  color: #c0c0d0;
}
.wiki-box .wiki-title { font-size: 12px; font-weight: bold; margin-bottom: 6px; color: #ffd700; }
.wiki-box .wiki-loading { color: #888; font-style: italic; }
.wiki-box a { color: #ffd700; text-decoration: underline; word-break: break-all; }

@media (max-width: 900px) {
  .app-main { flex-direction: column; padding: 4px; }
  .sidebar { width: 100%; height: 50px; flex-direction: row; padding: 6px; overflow-x: auto; }
  .nav-btn { width: 36px; height: 36px; }
  .right-panel { width: 100%; min-width: unset; height: 45vh; }
  .right-panel.collapsed { height: 48px; width: 100%; min-width: unset; }
  .cards-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .zone-veil { width: 80vw; }
}
</style>
</head>
<body>

<div class="zone-veil red" id="veilRed"></div>
<div class="zone-veil purple" id="veilPurple"></div>
<div class="sweep-overlay" id="sweepOverlay"></div>

<header class="app-header">
  <div class="logo-area">
    <div class="logo">RE</div>
    <div class="app-title">
      <h1 class="gold-text">Vaztoodix RE Studio</h1>
      <span class="version">v1.4 — Catégorie Cheat & Mega Intégrés</span>
    </div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="btnClose">✕</button>
  </div>
</header>

<main class="app-main">
  <aside class="sidebar">
    <button class="nav-btn active" data-cat="home" title="Accueil">🏠</button>
    <button class="nav-btn" data-cat="cheat" title="Zone Cheat">🏴‍☠️</button>
    <button class="nav-btn" data-cat="zone-red" title="Zone Rouge (HTML Brut)">🔴</button>
    <button class="nav-btn" data-cat="zone-purple" title="Zone Violette (Mods & APK)">🟣</button>
    <button class="nav-btn" data-cat="termux" title="Termux">📱</button>
    <button class="nav-btn" data-cat="linux" title="Linux">🐧</button>
    <button class="nav-btn" data-cat="ai" title="IA">🤖</button>
    <button class="nav-btn" data-cat="ides" title="IDEs">💻</button>
  </aside>

  <section class="center-panel">
    <div class="panel-header" id="panelHeader">
      <h2 id="catTitle" class="gold-text">🏠 Accueil</h2>
      <p id="catDesc">Guide complet de décompilation C++ / .so / APK</p>
      <input type="text" id="searchBox" class="search-input" placeholder="🔍 Rechercher...">
    </div>
    <div class="panel-content" id="content"></div>
  </section>

  <aside class="right-panel" id="rightPanel">
    <div class="right-header">
      <span class="gold-text">📖 Détails</span>
      <button class="icon-btn" id="btnCollapseRight" style="width:24px;height:24px;font-size:11px;">◧</button>
    </div>
    <div class="detail-content" id="detailContent">
      <p style="font-size:12px;color:#888;text-align:center;padding:20px 0;">
        👈 Clique sur une carte pour voir les détails, le tutoriel et la fiche Wikipédia.
      </p>
    </div>
  </aside>
</main>

<script>
const CATEGORIES = {
  home: {
    title: "🏠 Accueil",
    desc: "Guide complet de décompilation C++ / .so / APK",
    items: [
      {
        id: "intro", name: "Reverse Engineering", icon: "📖", wiki: "Reverse_engineering",
        desc: "Le reverse engineering (RE) est l'art de comprendre le fonctionnement d'un programme à partir de son code compilé. Sur Android, les applications et jeux sont souvent compilés en fichiers .so (Shared Object) en C++ avec le compilateur NDK.",
        tools: ["Ghidra", "Radare2", "IDA Pro"]
      }
    ]
  },
  cheat: {
    title: "🏴‍☠️ Zone Cheat & Mods (> 1 Go)",
    desc: "Section dédiée aux jeux majeurs et aux fichiers volumineux hébergés sur Mega avec fiches Wikipédia associées.",
    theme: "cheat",
    items: [
      {
        id: "cheat-fortnite", name: "Fortnite", icon: "🌀", wiki: "Fortnite",
        desc: "Jeu vidéo de type battle royale développé par Epic Games. Accès aux packages et fichiers de modding (> 1 Go) hébergés sur Mega.",
        tools: ["Mega", "Unreal Engine"],
        megaLink: "https://mega.nz/folder/SsIkWbBR#6lRkIDCfleuqEzRMYQY2uA"
      },
      {
        id: "cheat-minecraft", name: "Minecraft", icon: "🧱", wiki: "Minecraft",
        desc: "Jeu bac à sable créé par Markus Persson (Notch) et développé par Mojang Studios. Gestion des mods et des clients personnalisés.",
        tools: ["Java", "Bedrock", "Forge"]
      },
      {
        id: "cheat-theforest", name: "The Forest", icon: "🌲", wiki: "The_Forest",
        desc: "Jeu vidéo de survie et d'horreur en monde ouvert développé par Endnight Games. Fichiers et archives du jeu disponibles sur Mega (> 1 Go).",
        tools: ["Mega", "Unity"],
        megaLink: "https://mega.nz/folder/H0JUxDDb#2yurAlAoz-10Vyn1A7a1dg"
      },
      {
        id: "cheat-brawlstars", name: "Brawl Stars", icon: "⭐", wiki: "Brawl_Stars",
        desc: "Jeu vidéo mobile de type arène de bataille en ligne multijoueur développé et édité par Supercell.",
        tools: ["Supercell", "APK", "Modding"]
      }
    ]
  },
  "zone-red": {
    title: "🔴 Zone Rouge — HTML Brut & Édition Web",
    desc: "Code source HTML, structure de la page, manipulation du DOM et outils web en local.",
    theme: "red",
    items: [
      {
        id: "red-html-struct", name: "Structure HTML Brute", icon: "📄", wiki: "HTML",
        desc: "Espace dédié à l'analyse et à la modification directe du code source de l'interface web.",
        tools: ["HTML5", "CSS3"]
      }
    ]
  },
  "zone-purple": {
    title: "🟣 Zone Violette — Mods, APK & Binaires",
    desc: "Modification de paquets APK, analyse d'exécutables Windows et outillage de modding.",
    theme: "purple",
    items: [
      {
        id: "purple-apk", name: "Fichiers APK & Smali", icon: "📦", wiki: "Android_Package",
        desc: "Analyse et décompilation de packages Android (.apk).",
        tools: ["Apktool", "JADX"]
      }
    ]
  },
  termux: {
    title: "📱 Termux (Android)",
    desc: "Outils de reverse engineering sur Android",
    items: []
  },
  linux: {
    title: "🐧 Linux (binaires généraux)",
    desc: "Outils pour analyser DLL, EXE, ELF",
    items: []
  },
  ai: {
    title: "🤖 IA & Reverse Engineering",
    desc: "Outils IA modernes pour accélérer la décompilation",
    items: []
  },
  ides: {
    title: "💻 IDEs recommandés",
    desc: "Claude Code, VS Code, Cursor",
    items: []
  }
};

const wikiCache = {};

async function fetchWikipedia(page, lang = "fr") {
  const key = lang + ":" + page;
  if (wikiCache[key]) return wikiCache[key];
  try {
    const url = `https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(page)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const result = {
      title: data.title || page,
      extract: data.extract || "Aucun résumé disponible.",
      url: data.content_urls?.desktop?.page || `https://${lang}.wikipedia.org/wiki/${page}`
    };
    wikiCache[key] = result;
    return result;
  } catch (e) {
    return { title: page, extract: "⚠️ Wikipédia inaccessible.", url: `https://fr.wikipedia.org/wiki/${page}`, error: true };
  }
}

const AppState = { currentCat: "home", searchQuery: "" };

const veilRed = document.getElementById("veilRed");
const veilPurple = document.getElementById("veilPurple");
const sweepOverlay = document.getElementById("sweepOverlay");

function updateZoneVeils(catName) {
  const cat = CATEGORIES[catName];
  const theme = cat?.theme || null;
  if (theme === "red") {
    veilRed.classList.add("active");
    veilPurple.classList.remove("active");
  } else if (theme === "purple") {
    veilPurple.classList.add("active");
    veilRed.classList.remove("active");
  } else {
    veilRed.classList.remove("active");
    veilPurple.classList.remove("active");
  }
}

function triggerSweep(theme) {
  if (!theme) return;
  sweepOverlay.classList.remove("fire", "from-left", "from-right");
  void sweepOverlay.offsetWidth;
  sweepOverlay.classList.add("fire", theme === "red" ? "from-left" : "from-right");
  setTimeout(() => {
    sweepOverlay.classList.remove("fire", "from-left", "from-right");
  }, 800);
}

function updatePanelsTheme(theme) {
  const panelHeader = document.getElementById("panelHeader");
  const rightPanel = document.getElementById("rightPanel");
  panelHeader.classList.remove("zone-red-theme", "zone-purple-theme", "cheat-theme");
  rightPanel.classList.remove("zone-red-theme", "zone-purple-theme", "cheat-theme");
  if (theme) {
    panelHeader.classList.add(theme === "cheat" ? "cheat-theme" : theme + "-theme");
    rightPanel.classList.add(theme === "cheat" ? "cheat-theme" : theme + "-theme");
  }
}

function showCategory(catName) {
  const cat = CATEGORIES[catName];
  if (!cat) return;
  const previousCat = AppState.currentCat;
  const previousTheme = CATEGORIES[previousCat]?.theme || null;
  const newTheme = cat.theme || null;

  if (newTheme && newTheme !== previousTheme) {
    triggerSweep(newTheme);
  }

  AppState.currentCat = catName;
  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.cat === catName);
  });

  updateZoneVeils(catName);
  updatePanelsTheme(newTheme);

  document.getElementById("catTitle").textContent = cat.title;
  document.getElementById("catDesc").textContent = cat.desc;
  renderContent();
}

function renderContent() {
  const cat = CATEGORIES[AppState.currentCat];
  let items = cat.items;
  if (AppState.searchQuery) {
    items = items.filter(it =>
      it.name.toLowerCase().includes(AppState.searchQuery) ||
      it.desc.toLowerCase().includes(AppState.searchQuery)
    );
  }
  const container = document.getElementById("content");
  container.innerHTML = "";

  if (items.length === 0) {
    container.innerHTML = `<p style="font-size:12px;color:#888;text-align:center;padding:20px;">Aucun élément.</p>`;
    return;
  }

  const grid = document.createElement("div");
  grid.className = "cards-grid";
  const theme = cat.theme || null;

  items.forEach(it => {
    const card = document.createElement("div");
    card.className = "card" + (theme === "red" ? " card-red" : theme === "purple" ? " card-purple" : theme === "cheat" ? " card-cheat" : "");
    card.innerHTML = `
      <div class="card-title">
        <span>${it.icon}</span>
        <span class="gold-text">${it.name}</span>
      </div>
      <div class="card-desc">${it.desc.substring(0, 130)}${it.desc.length > 130 ? "..." : ""}</div>
      <div class="detail-meta" style="margin-top:8px;">
        ${(it.tools || []).slice(0, 3).map(t => `<span class="meta-tag">${t}</span>`).join("")}
      </div>
    `;
    card.addEventListener("click", () => selectItem(it.id));
    grid.appendChild(card);
  });

  container.appendChild(grid);
  container.scrollTop = 0;
}

function selectItem(id) {
  for (const catName in CATEGORIES) {
    const item = CATEGORIES[catName].items.find(it => it.id === id);
    if (item) {
      renderDetail(item);
      document.getElementById("rightPanel").scrollTop = 0;
      if (window.innerWidth < 900) {
        document.getElementById("rightPanel").scrollIntoView({ behavior: "smooth" });
      }
      return;
    }
  }
}

async function renderDetail(item) {
  const container = document.getElementById("detailContent");

  let html = `
    <div class="detail-title gold-text">${item.icon} ${item.name}</div>
    <div class="detail-desc">${item.desc}</div>
    <div class="detail-meta">
      ${(item.tools || []).map(t => `<span class="meta-tag">${t}</span>`).join("")}
    </div>
  `;

  if (item.megaLink) {
    html += `
      <div style="margin-top:12px;">
        <div class="gold-text" style="font-size:12px;margin-bottom:6px;">📥 Téléchargement Mega (> 1 Go)</div>
        <button class="nav-btn active" style="width:100%; height:34px; font-size:12px; border-radius:7px; cursor:pointer;" onclick="window.open('${item.megaLink}', '_blank')">
          Accéder au dossier Mega ↗
        </button>
      </div>
    `;
  }

  if (item.wiki) {
    html += `
      <div style="margin-top:12px;">
        <div class="gold-text" style="font-size:12px;margin-bottom:6px;">🌐 Fiche Wikipédia</div>
        <div class="wiki-box" id="wikiBox">
          <div class="wiki-title">${item.wiki}</div>
          <div class="wiki-loading">Chargement depuis Wikipédia...</div>
        </div>
      </div>
    `;
  }

  container.innerHTML = html;

  if (item.wiki) {
    try {
      const wiki = await fetchWikipedia(item.wiki, "fr");
      const box = document.getElementById("wikiBox");
      if (box) {
        if (wiki.error) {
          box.innerHTML = `<div class="wiki-title">${wiki.title}</div><div class="wiki-loading">⚠️ Indisponible. <a href="${wiki.url}" target="_blank">Ouvrir</a></div>`;
        } else {
          box.innerHTML = `<div class="wiki-title">${wiki.title}</div><div>${wiki.extract}</div><div style="margin-top:8px;"><a href="${wiki.url}" target="_blank">📖 Lire l'article complet sur Wikipédia</a></div>`;
        }
      }
    } catch (e) {
      console.warn("Erreur wiki:", e);
    }
  }
}

document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.addEventListener("click", () => showCategory(btn.dataset.cat));
  });
  document.getElementById("searchBox").addEventListener("input", (e) => {
    AppState.searchQuery = e.target.value.toLowerCase();
    renderContent();
  });
  document.getElementById("btnClose")?.addEventListener("click", () => {
    if (confirm("Fermer l'application ?")) window.close();
  });
  document.getElementById("btnCollapseRight")?.addEventListener("click", () => {
    document.getElementById("rightPanel").classList.toggle("collapsed");
  });
  showCategory("home");
});
</script>
</body>
