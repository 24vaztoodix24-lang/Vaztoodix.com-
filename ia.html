.card { background: rgba(25,25,40,0.8); border: 1px solid rgba(255,215,0,0.15); border-radius: 10px; padding: 12px 14px; cursor: pointer; min-height: 90px; display: block; user-select: none; transition: 0.2s; }

.card-title { font-size: 13px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.card-desc { font-size: 11px; color: #a0a0b0; line-height: 1.5; }

.right-panel { width: 42%; min-width: 320px; background: rgba(15,15,25,0.75); border: 1px solid rgba(255,215,0,0.2); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; min-height: 0; }
.right-panel.collapsed { width: 48px; min-width: 48px; padding: 6px 4px; }
.right-panel.collapsed .detail-content { display: none; }
.right-header { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: bold; flex-shrink: 0; }
.detail-content { display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; }
.detail-title { font-size: 16px; margin-bottom: 4px; }
.detail-desc { font-size: 12px; color: #b0b0c0; line-height: 1.6; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 8px; border-left: 3px solid #ffd700; }
.detail-meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 11px; }
.tutorial-content { font-family: 'Consolas', 'Monaco', monospace; font-size: 11px; line-height: 1.7; background: rgba(0,0,0,0.5); border-radius: 8px; padding: 12px; border: 1px solid rgba(255,215,0,0.15); white-space: pre-wrap; color: #c0c0d0; overflow-x: auto; }
.tutorial-content .comment { color: #6a6a80; font-style: italic; }
.tutorial-content .cmd { color: #50dc78; font-weight: bold; }
.link-btn { width: 100%; height: 34px; font-size: 12px; border-radius: 7px; cursor: pointer; border: 1px solid rgba(255,215,0,0.3); background: rgba(255,215,0,0.1); color: #ffd700; margin-bottom: 6px; display: flex; align-items: center; justify-content: center; gap: 6px; }
@media (max-width: 900px) { .app-main { flex-direction: column; padding: 4px; } .sidebar { width: 100%; height: 50px; flex-direction: row; padding: 6px; overflow-x: auto; } .nav-btn { width: 36px; height: 36px; } .right-panel { width: 100%; min-width: unset; height: 45vh; } .right-panel.collapsed { height: 48px; width: 100%; min-width: unset; } .cards-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } }
@media (max-width: 500px) { .cards-grid { grid-template-columns: 1fr; } }

<script>
const CARDS = [
  { icon:"🔄", name:"REA", desc:"Serveur MCP qui connecte un agent IA à Ghidra, Hopper ou IDA. Renomme et réécrit automatiquement.", tags:["MCP","Claude","Ghidra"],
    links:[{label:"REA GitHub",url:"https://github.com/agentic-ai/rea"}],
    tutorial:`# ===== INSTALLATION DE REA =====
git clone https://github.com/agentic-ai/rea.git
cd rea
pip install -r requirements.txt

export ANTHROPIC_API_KEY="sk-ant-..."
python3 server.py --ghidra-path /opt/ghidra
python3 rea.py --target libtarget.so --agent claude

# L'agent va automatiquement :
# - Analyser le binaire
# - Identifier les fonctions importantes
# - Renommer les variables
# - Chercher des vulnérabilités

# ===== FIN =====` },
  { icon:"🌉", name:"GhidraMCP", desc:"Bridge MCP gratuit entre Ghidra et n'importe quel client LLM (Claude, GPT).", tags:["Ghidra","MCP","Python"],
    links:[{label:"GhidraMCP GitHub",url:"https://github.com/LaurieWired/GhidraMCP"}],
    tutorial:`# ===== INSTALLATION DE GHIDRAMCP =====
git clone https://github.com/LaurieWired/GhidraMCP.git
cd GhidraMCP
pip install -r requirements.txt

# 1. Installer le plugin dans Ghidra
#    File → Install Extensions → GhidraMCP
# 2. Redémarrer Ghidra
# 3. Lancer le serveur MCP
python3 bridge_mcp_ghidra.py

# 4. Connecter un client LLM (Claude Desktop / VS Code)
# Fonctionnalités : rename_function, get_function, cross_references

# ===== FIN =====` },
  { icon:"🎮", name:"BetterDecompiler", desc:"Outil Roblox : IA suggère des noms de variables (pas de réécriture). Zéro risque de bug.", tags:["Luau","Roblox","IA"],
    links:[{label:"BetterDecompiler GitHub",url:"https://github.com/betterdecompiler/betterdecompiler"}],
    tutorial:`# ===== BETTERDECOMPILER =====
# 1. In-game :
saveinstance()

# 2. Décompiler avec Decompiler.com
# 3. Ouvrir le code Luau dans BetterDecompiler
# 4. L'IA suggère des noms :
#    v1 → player
#    v2 → character
#    v3 → humanoid
# 5. Toujours relire manuellement

# ===== FIN =====` }
];

function renderCards() {
  const grid = document.createElement("div");
  grid.className = "cards-grid";
  CARDS.forEach(c => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<div class="card-title"><span>${c.icon}</span><span class="gold-text">${c.name}</span></div>
      <div class="card-desc">${c.desc}</div>
      <div class="detail-meta" style="margin-top:8px;">${c.tags.slice(0,3).map(t=>`<span class="meta-tag">${t}</span>`).join("")}</div>`;
    card.onclick = () => showDetail(c);
    grid.appendChild(card);
  });
  document.getElementById("content").appendChild(grid);
}

function showDetail(item) {
  const panel = document.getElementById("rightPanel");
  panel.classList.remove("collapsed");
  let html = `<div class="detail-title gold-text">${item.icon} ${item.name}</div>
    <div class="detail-desc">${item.desc}</div>
    <div class="detail-meta">${item.tags.map(t=>`<span class="meta-tag">${t}</span>`).join("")}</div>`;
  if (item.links && item.links.length) {
    html += `<div style="margin-top:12px;"><div class="gold-text" style="font-size:12px;margin-bottom:6px;">🔗 Liens</div>
      ${item.links.map(l=>`<button class="link-btn" onclick="window.open('${l.url}','_blank')">${l.label} ↗</button>`).join("")}</div>`;
  }
  if (item.tutorial) {
    html += `<div style="margin-top:12px;"><div class="gold-text" style="font-size:12px;margin-bottom:6px;">📋 Tutoriel</div>
      <div class="tutorial-content">${formatTuto(item.tutorial)}</div></div>`;
  }
  document.getElementById("detailContent").innerHTML = html;
  if (window.innerWidth < 900) panel.scrollIntoView({behavior:"smooth"});
}

function formatTuto(text) {
  return text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/^(#.*)$/gm,'<span class="comment">$1</span>')
    .replace(/(git clone|pip install|python3|python |export |npm install|claude)/g,'<span class="cmd">$1</span>');
}

document.getElementById("btnDiscordHeader")?.addEventListener("click", () => window.open("https://discord.gg/xzqhhXdH9j","_blank"));
document.getElementById("btnClose")?.addEventListener("click", () => { if (confirm("Fermer ?")) window.close(); });
document.getElementById("btnCollapseRight")?.addEventListener("click", () => document.getElementById("rightPanel").classList.toggle("collapsed"));
renderCards();
</script>
