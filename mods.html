<script>
const CARDS = [
  {
    icon:"📦", name:"Fichiers APK & Smali",
    desc:"Analyse et décompilation de packages Android (.apk). Modification des manifests, injection smali, signature de paquets.",
    tags:["Apktool","JADX","apksigner"],
    links:[],
    tutorial:`# ===== MANIPULATION APK & SIGNATURE =====
# 1. Décompiler l'APK
apktool d application.apk

# 2. Recompiler après modification
apktool b application -out modded.apk

# 3. Générer une clé de signature
keytool -genkey -v -keystore my-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-alias

# 4. Signer l'APK final
apksigner sign --ks my-release-key.jks modded.apk

# ===== FIN =====`
  },
  {
    icon:"💻", name:"Binaires Windows (.exe / .dll)",
    desc:"Analyse de structures PE (Portable Executable) pour exécutables Windows et bibliothèques dynamiques (.dll). Désassemblage et patchs de code natif.",
    tags:["PEview","Ghidra","x64dbg"],
    links:[],
    tutorial:`# ===== ANALYSE PE =====
# 1. Inspecter les en-têtes
peview monprogramme.exe

# 2. Décompiler avec Ghidra
analyzeHeadless /projets Projet -import monprogramme.exe

# 3. Déboguer avec x64dbg
x64dbg monprogramme.exe
# Breakpoints, step, registres, mémoire

# ===== FIN =====`
  }
];

function renderCards() {
  const grid = document.createElement("div");
  grid.className = "cards-grid";
  CARDS.forEach(c => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<div class="card-title"><span>${c.icon}</span><span class="gold-text">${c.name}</span></div>
      <div class="card-desc">${c.desc.substring(0,130)}${c.desc.length>130?"...":""}</div>
      <div class="detail-meta" style="margin-top:8px;">${c.tags.slice(0,3).map(t=>`<span class="meta-tag">${t}</span>`).join("")}</div>`;
    card.onclick = () => showDetail(c);
    grid.appendChild(card);
  });
  document.getElementById("content").appendChild(grid);
}

function showDetail(item) {
  const panel = document.getElementById("rightPanel");
  panel.classList.remove("collapsed");
  let html = `<div class="detail-title gold-text">${item.icon} ${item.name}</div>
    <div class="detail-desc">${item.desc}</div>
    <div class="detail-meta">${item.tags.map(t=>`<span class="meta-tag">${t}</span>`).join("")}</div>`;
  if (item.links && item.links.length) {
    html += `<div style="margin-top:12px;"><div class="gold-text" style="font-size:12px;margin-bottom:6px;">🔗 Liens</div>
      ${item.links.map(l=>`<button class="link-btn ${l.type}" onclick="window.open('${l.url}','_blank')">${l.label} ↗</button>`).join("")}</div>`;
  }
  if (item.tutorial) {
    html += `<div style="margin-top:12px;"><div class="gold-text" style="font-size:12px;margin-bottom:6px;">📋 Tutoriel</div>
      <div class="tutorial-content">${formatTuto(item.tutorial)}</div></div>`;
  }
  document.getElementById("detailContent").innerHTML = html;
  if (window.innerWidth < 900) panel.scrollIntoView({behavior:"smooth"});
}

function formatTuto(text) {
  return text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/^(#.*)$/gm,'<span class="comment">$1</span>')
    .replace(/(apktool|apksigner|keytool|peview|x64dbg|analyzeHeadless)/g,'<span class="cmd">$1</span>');
}

document.getElementById("btnDiscordHeader")?.addEventListener("click", () => window.open("https://discord.gg/xzqhhXdH9j","_blank"));
document.getElementById("btnClose")?.addEventListener("click", () => { if (confirm("Fermer ?")) window.close(); });
document.getElementById("btnCollapseRight")?.addEventListener("click", () => document.getElementById("rightPanel").classList.toggle("collapsed"));
renderCards();
</script>
